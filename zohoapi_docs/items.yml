    purchase_description:
      description: Purchase description for the item.
      type: string
      example: ' '
    purchase_rate:
      description: Purchase price of the item.
      type: string
      example: ' '
    purchase_account_id:
      description: 'ID of the COGS account to which the item has to be associated with. Mandatory, if item_type is purchase / sales and purchase / inventory. Note: This value is a set of numeric characters.'
      type: string
      example: ' '
    inventory_account_id:
      description: 'ID of the stock account to which the item has to be associated with. Mandatory, if item_type is inventory. Note: This value is a set of numeric characters.'
      type: string
      example: ' '
    vendor_id:
      description: 'Preferred vendor ID. Note: This value is a set of numeric characters.'
      type: string
      example: ' '
    customfield_id:
      type: string
      description: 'ID of the custom field. Note: This value is a set of numeric characters.'
      example: '46000000012845'
    value:
      description: Value of the Custom Field
      type: string
      example: Normal
    custom_fields:
      description: Custom fields for an item.
      type: array
      items:
        type: object
        properties:
          customfield_id:
            $ref: '#/components/schemas/customfield_id'
          value:
            $ref: '#/components/schemas/value'
    reorder_level:
      description: Reorder level of the item.
      type: string
      example: ' '
    initial_stock:
      description: Opening stock of the item.
      type: string
      example: ' '
    initial_stock_rate:
      description: Unit price of the opening stock.
      type: string
      example: ' '
    item_type:
      description: 'Type of the item. Allowed values: <code>sales</code>,<code>purchases</code>,<code>sales_and_purchases</code> and <code>inventory</code>. Default value will be <code>sales</code>.'
      type: string
      example: ' '
    item_id:
      description: 'ID of the item. Note: This value is a set of numeric characters.'
      type: string
      example: 45667789900
    tax_percentage:
      description: Percent of the tax.
      type: string
      example: 70%
    tax_type:
      description: Type of the tax.
      type: string
      example: tax
    filter_by:
      description: 'Filter items by status. Allowed Values: <code>Status.All</code>, <code>Status.Active</code> and <code>Status.Inactive</code>'
      type: string
    search_text:
      description: Search items by name or description. Max-length [100]
      type: string
    sort_column:
      description: 'Sort items. Allowed Values: <code>name</code>, <code>rate</code> and <code>tax_name</code>'
      type: string
      example: name
    product_type:
      description: Specify the type of an item. Allowed values:<br/><code> goods</code> or <code> service</code> or <code> digital_service</code>. <br/><b>For SouthAfrica Edition:</b> <code>service</code>, <code>goods</code>, <code>capital_service</code> and <code>capital_goods</code>
      type: string
      example: goods
    sku:
