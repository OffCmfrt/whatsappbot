            type: string
        - name: name
          in: query
          description: Filter by exact variant name.
          required: false
          schema:
            type: string
        - name: name_startswith
          in: query
          description: Filter by variant name that starts with the given value.
          required: false
          schema:
            type: string
        - name: name_contains
          in: query
          description: Filter by variant name that contains the given value.
          required: false
          schema:
            type: string
        - name: sku
          in: query
          description: Filter by exact SKU.
          required: false
          schema:
            type: string
        - name: sku_startswith
          in: query
          description: Filter by SKU that starts with the given value.
          required: false
          schema:
            type: string
        - name: sku_contains
          in: query
          description: Filter by SKU that contains the given value.
          required: false
          schema:
            type: string
        - name: rate
          in: query
          description: Filter by exact selling rate.
          required: false
          schema:
            type: number
            format: double
        - name: purchase_rate
          in: query
          description: Filter by exact purchase rate.
          required: false
          schema:
            type: number
            format: double
        - name: item_master_id
          in: query
          description: Filter variants belonging to the given item.
          required: false
          schema:
            type: string
          example: '4815000000044220'
        - name: variant_ids
          in: query
          description: Comma-separated list of variant IDs to fetch.
          required: false
          schema:
            type: string
          example: 4815000000044208,4815000000044220
        - name: brand
          in: query
          description: Filter by brand.
          required: false
          schema:
            type: string
        - name: manufacturer
          in: query
          description: Filter by manufacturer.
          required: false
          schema:
            type: string
        - name: category_id
          in: query
          description: Filter by category ID.
          required: false
          schema:
            type: string
          example: '4815000000044001'
        - name: warehouse_id
          in: query
          description: Filter by warehouse ID.
          required: false
