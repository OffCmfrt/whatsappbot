            type: string
        - name: filter_by
          in: query
          description: Filter variants by status or item type. Allowed values include <code>Status.All</code>, <code>Status.Active</code>, <code>Status.Inactive</code>, <code>Status.Lowstock</code>, <code>Status.Unmapped</code>, <code>Status.Uncategorized</code>, <code>Status.Grouped</code>, and item-type filters from the Items list API.
          required: false
