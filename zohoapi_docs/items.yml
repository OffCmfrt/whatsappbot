openapi: 3.0.0
info:
  title: Items
  description: Items are the products or services that you sell to your customers.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.com/books/v3
    description: API Endpoint
tags:
  - name: items
    description: Items Module
paths:
  /items:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: create_item
      summary: Create an Item
      description: Create a new item.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-an-item-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-an-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.CREATE
    get:
      tags:
        - items
      operationId: list_items
      summary: List items
      description: Get the list of all active items with pagination.
      parameters:
        - name: name
          in: query
          description: 'Search items by name. Max-length [100]. Variants: <code>name_startswith</code> and <code>name_contains</code>'
          required: false
          schema:
            type: string
          example: Hard Drive
        - name: name_startswith
          in: query
          description: Search items whose name starts with the specified value. Maximum length allowed is 100 characters.
          required: false
          schema:
            type: string
          example: Hard Drive
        - name: name_contains
          in: query
          description: Search items whose name contains the specified value. Maximum length allowed is 100 characters.
          required: false
          schema:
            type: string
          example: Hard Drive
        - name: description
          in: query
          description: 'Search items by description. Max-length [100]. Variants: <code>description_startswith</code> and <code>description_contains</code>'
          required: false
          schema:
            type: string
          example: 500GB
        - name: description_startswith
          in: query
          description: Search items whose description starts with the specified value. Maximum length allowed is 100 characters.
          required: false
          schema:
            type: string
          example: 500GB
        - name: description_contains
          in: query
          description: Search items whose description contains the specified value. Maximum length allowed is 100 characters.
          required: false
          schema:
            type: string
          example: 500GB
        - name: rate
          in: query
          description: 'Search items by rate. Variants: <code>rate_less_than</code>, <code>rate_less_equals</code>, <code>rate_greater_than</code> and <code>rate_greater_equals</code>'
          required: false
          schema:
            type: string
          example: 120
        - name: rate_less_than
          in: query
          description: Search items whose rate is less than the specified value.
          required: false
          schema:
            type: string
          example: 120
        - name: rate_less_equals
          in: query
          description: Search items whose rate is less than or equal to the specified value.
          required: false
          schema:
            type: string
          example: 120
        - name: rate_greater_than
          in: query
          description: Search items whose rate is greater than the specified value.
          required: false
          schema:
            type: string
          example: 120
        - name: rate_greater_equals
          in: query
          description: Search items whose rate is greater than or equal to the specified value.
          required: false
          schema:
            type: string
          example: 120
        - name: tax_id
          in: query
          description: 'Search items by tax id. Note: This value is a set of numeric characters.'
          required: false
          schema:
            type: string
          example: 982000000037049
        - name: tax_name
          in: query
          description: Search items by tax name. Max-length [100]
          required: false
          schema:
            type: string
          example: Sales Tax
        - name: is_taxable
          in: query
          description: Boolean to track the taxability of the item.
          required: false
          schema:
            type: boolean
          x-node_available_in:
            - in
            - us
            - mx
          x-node_unavailable_in: []
        - name: tax_exemption_id
          in: query
          description: 'ID of the tax exemption. Mandatory, if <code>is_taxable</code> is false. Note: This value is a set of numeric characters.'
          required: false
          schema:
            type: string
          x-node_available_in:
            - in
            - us
            - mx
          x-node_unavailable_in: []
          example: ''
        - name: account_id
          in: query
          description: 'ID of the account to which the item has to be associated with. Note: This value is a set of numeric characters.'
          required: false
          schema:
            type: string
          example: ''
        - name: filter_by
          in: query
          description: 'Filter items by status. Allowed Values: <code>Status.All</code>, <code>Status.Active</code> and <code>Status.Inactive</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: search_text
          in: query
          description: Search items by name or description. Max-length [100]
          required: false
          schema:
            type: string
          example: ''
        - name: sort_column
          in: query
          description: 'Sort items. Allowed Values: <code>name</code>, <code>rate</code> and <code>tax_name</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: sat_item_key_code
          in: query
          description: SAT Item key code
          required: false
          schema:
            type: string
          x-node_available_in:
            - mx
          x-node_unavailable_in: []
          example: ''
        - name: unitkey_code
          in: query
          description: SAT Unit code
          required: false
          schema:
            type: string
          x-node_available_in:
            - mx
          x-node_unavailable_in: []
          example: ''
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page.
          required: false
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-items-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.READ
    put:
      tags:
        - items
      operationId: update_item_using_custom_field
      summary: Update an item using a custom field's unique value
      description: A custom field will have unique values if it's configured to not accept duplicate values. Now, you can use that custom field's value to update an item by providing its API name in the X-Unique-Identifier-Key header and its value in the X-Unique-Identifier-Value header. Based on this value, the corresponding item will be retrieved and updated. Additionally, there is an optional X-Upsert header. If the X-Upsert header is true and the custom field's unique value is not found in any of the existing items, a new item will be created if the necessary payload details are available
      parameters:
        - name: X-Unique-Identifier-Key
          in: header
          description: Unique CustomField Api Name
          required: true
          schema:
            type: string
            example: cf_unique_cf
        - name: X-Unique-Identifier-Value
          in: header
          description: Unique CustomField Value
          required: true
          schema:
            type: string
            example: unique Value
        - name: X-Upsert
          in: header
          description: If there is no record is found unique custom field value , will create new invoice
          required: false
          schema:
            type: boolean
            example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-an-item-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-an-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.UPDATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /itemdetails:
    x-mcp-group:
      - Items
    get:
      tags:
        - items
      operationId: list_item_details
      summary: Bulk fetch item details
      description: Fetch item details for the mentioned item IDs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulk-fetch-item-details-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.READ
    parameters:
      - name: item_ids
        in: query
        required: true
        description: '<code>List of item ids separated by comma</code>. Note: This value is a set of numeric characters separated by comma.'
        schema:
          type: string
        example: 4815000000044208,4815000000044274,4815000000044340
      - $ref: '#/components/parameters/organization_id'
  /items/{item_id}:
    x-mcp-group:
      - Items
    put:
      tags:
        - items
      operationId: update_item
      summary: Update an item
      description: Update the details of an item.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-an-item-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-an-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.UPDATE
    get:
      tags:
        - items
      operationId: get_item
      summary: Get an item
      description: Details of an existing item.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-an-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.READ
    delete:
      tags:
        - items
      operationId: delete_item
      summary: Delete an item
      description: Delete the item created.items that are part of transaction cannot be deleted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-an-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.DELETE
    parameters:
      - name: item_id
        in: path
        required: true
        description: 'Unique identifier of the item. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 45667789900
      - $ref: '#/components/parameters/organization_id'
  /item/{item_id}/customfields:
    x-mcp-group:
      - Items
    put:
      tags:
        - items
      operationId: update_custom_fields_in_item
      summary: Update custom field in existing items
      description: Update the value of the custom field in existing items.
      parameters:
        - name: item_id
          in: path
          required: true
          description: 'Unique identifier of the item. Note: This value is a set of numeric characters.'
          schema:
            type: string
          example: 45667789900
        - $ref: '#/components/parameters/organization_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/custom_fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-an-item-customfield-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.UPDATE
  /items/{item_id}/active:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: mark_item_active
      summary: Mark as active
      description: Mark an inactive item as active.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-active-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.CREATE
    parameters:
      - name: item_id
        in: path
        required: true
        description: 'Unique identifier of the item. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 45667789900
      - $ref: '#/components/parameters/organization_id'
  /items/{item_id}/inactive:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: mark_item_inactive
      summary: Mark as inactive
      description: Mark an active item as inactive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-inactive-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.settings.CREATE
    parameters:
      - name: item_id
        in: path
        required: true
        description: 'Unique identifier of the item. Note: This value is a set of numeric characters.'
        schema:
          type: string
        example: 45667789900
      - $ref: '#/components/parameters/organization_id'
  /itemmasters:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: create_item_master
      summary: Create an item
      description: Creates a new item in Zoho Books. You can attach an image by passing the form-data parameter <code>image</code>.
      parameters:
        - name: pricebook_id
          in: query
          description: Price book ID associated with the create request.
          required: false
          schema:
            type: string
          example: '4815000000044700'
        - name: date
          in: query
          description: Date in <code>yyyy-mm-dd</code> format used for price computation.
          required: false
          schema:
            type: string
        - name: document_ids
          in: query
          description: Comma-separated document IDs to associate with the item.
          required: false
          schema:
            type: string
        - name: can_sync_to_variant
          in: query
          description: When <code>true</code>, sync applicable item fields to its variants.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-an-item-master-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-an-item-master-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.CREATE
    get:
      tags:
        - items
      operationId: list_item_masters
      summary: List items
      description: Lists all items in the organization. Supports filters, search, and pagination.
      parameters:
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page. Default value is 25.
          required: false
          schema:
            type: integer
            default: 25
          example: 25
        - name: search_text
          in: query
          description: Search items by name or other searchable fields.
          required: false
          schema:
            type: string
        - name: filter_by
          in: query
          description: 'Filter items by status. Allowed values: <code>Status.All</code>, <code>Status.Active</code>, <code>Status.Inactive</code>, <code>Status.Ungrouped</code>, <code>Status.Grouped</code>.'
          required: false
          schema:
            type: string
        - name: sort_column
          in: query
          description: 'Sort by column. Allowed values: <code>group_name</code>, <code>created_time</code>, <code>last_modified_time</code>, <code>item_master_name</code>.'
          required: false
          schema:
            type: string
        - name: sort_order
          in: query
          description: 'Sort order. Allowed values: <code>A</code> for ascending and <code>D</code> for descending.'
          required: false
          schema:
            type: string
        - name: item_master_name
          in: query
          description: Filter by exact item name.
          required: false
          schema:
            type: string
        - name: item_master_name_startswith
          in: query
          description: Filter by item name that starts with the given value.
          required: false
          schema:
            type: string
        - name: item_master_name_contains
          in: query
          description: Filter by item name that contains the given value.
          required: false
          schema:
            type: string
        - name: description
          in: query
          description: Filter by exact description.
          required: false
          schema:
            type: string
        - name: rate
          in: query
          description: Filter by exact selling rate.
          required: false
          schema:
            type: number
            format: double
        - name: purchase_rate
          in: query
          description: Filter by exact purchase rate.
          required: false
          schema:
            type: number
            format: double
        - name: brand
          in: query
          description: Filter by brand.
          required: false
          schema:
            type: string
        - name: manufacturer
          in: query
          description: Filter by manufacturer.
          required: false
          schema:
            type: string
        - name: category_id
          in: query
          description: Filter by category ID.
          required: false
          schema:
            type: string
          example: '4815000000044001'
        - name: account_id
          in: query
          description: Filter by sales account ID.
          required: false
          schema:
            type: string
          example: '4815000000035001'
        - name: purchase_account_id
          in: query
          description: Filter by purchase account ID.
          required: false
          schema:
            type: string
          example: '4815000000035003'
        - name: inventory_account_id
          in: query
          description: Filter by inventory account ID.
          required: false
          schema:
            type: string
          example: '4815000000035005'
        - name: tax_id
          in: query
          description: Filter by tax ID.
          required: false
          schema:
            type: string
          example: '4815000000044043'
        - name: skip_variant
          in: query
          description: When <code>true</code>, omit nested variant details from the list response.
          required: false
          schema:
            type: boolean
        - name: last_modified_time
          in: query
          description: Return items modified on or after this UTC datetime.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-item-masters-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /itemmasters/{item_master_id}:
    x-mcp-group:
      - Items
    get:
      tags:
        - items
      operationId: get_item_master
      summary: Retrieve an item
      description: Fetches the details of an existing item.
      parameters:
        - name: include
          in: query
          description: 'Additional response content. Allowed value: <code>html</code>.'
          required: false
          schema:
            type: string
        - name: print
          in: query
          description: Print-related flag. Allowed values follow the boolean-all convention.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-an-item-master-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.READ
    put:
      tags:
        - items
      operationId: update_item_master
      summary: Update an item
      description: Updates the details of an existing item. You can attach or replace an image by passing the form-data parameter <code>image</code>.
      parameters:
        - name: update_recurring_invoice
          in: query
          description: When <code>true</code>, apply rate changes to associated recurring invoices.
          required: false
          schema:
            type: boolean
        - name: pricebook_id
          in: query
          description: Price book ID associated with the update request.
          required: false
          schema:
            type: string
          example: '4815000000044700'
        - name: date
          in: query
          description: Date in <code>yyyy-mm-dd</code> format used for price computation.
          required: false
          schema:
            type: string
        - name: delete_image
          in: query
          description: When <code>true</code>, deletes the existing item image.
          required: false
          schema:
            type: boolean
        - name: can_sync_to_variant
          in: query
          description: When <code>true</code>, sync applicable item fields to its variants.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-an-item-master-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-an-item-master-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.UPDATE
    delete:
      tags:
        - items
      operationId: delete_item_master
      summary: Delete an item
      description: Deletes an existing item.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-an-item-master-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.DELETE
    parameters:
      - name: item_master_id
        in: path
        required: true
        description: Unique identifier of the item.
        schema:
          type: string
        example: 4815000000044220
      - $ref: '#/components/parameters/organization_id'
  /itemmasters/active:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: bulk_mark_item_masters_active
      summary: Bulk mark items as active
      description: Changes the status of multiple items to active.
      parameters:
        - name: item_master_ids
          in: query
          description: Comma-separated list of item IDs.
          required: true
          schema:
            type: string
          example: 4815000000044220,4815000000044221
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-active-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /itemmasters/inactive:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: bulk_mark_item_masters_inactive
      summary: Bulk mark items as inactive
      description: Changes the status of multiple items to inactive.
      parameters:
        - name: item_master_ids
          in: query
          description: Comma-separated list of item IDs.
          required: true
          schema:
            type: string
          example: 4815000000044220,4815000000044221
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-inactive-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /itemmasters/{item_master_id}/active:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: mark_item_master_as_active
      summary: Mark an item as active
      description: Changes the status of an item to active.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-active-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.CREATE
    parameters:
      - name: item_master_id
        in: path
        required: true
        description: Unique identifier of the item.
        schema:
          type: string
        example: 4815000000044220
      - $ref: '#/components/parameters/organization_id'
  /itemmasters/{item_master_id}/inactive:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: mark_item_master_as_inactive
      summary: Mark an item as inactive
      description: Changes the status of an item to inactive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-inactive-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoBooks.items.CREATE
    parameters:
      - name: item_master_id
        in: path
        required: true
        description: Unique identifier of the item.
        schema:
          type: string
        example: 4815000000044220
      - $ref: '#/components/parameters/organization_id'
  /itemvariants:
    x-mcp-group:
      - Items
    post:
      tags:
        - items
      operationId: create_item_variant
      summary: Create an item variant
      description: Creates a new item variant in Zoho Books. You can attach an image by passing the form-data parameter <code>image</code>.
      parameters:
        - name: pricebook_id
          in: query
          description: Price book ID associated with the create request.
          required: false
          schema:
            type: string
          example: '4815000000044700'
        - name: date
          in: query
          description: Date in <code>yyyy-mm-dd</code> format used for price computation.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
