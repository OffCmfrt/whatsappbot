        - name: last_modified_time
          in: query
          description: Return variants modified on or after this UTC datetime.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-item-variants-response'
      deprecated: false
