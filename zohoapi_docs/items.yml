components:
  parameters:
    organization_id:
      name: organization_id
      description: 'ID of the organization. Note: This value is a set of numeric characters.'
      in: query
      required: true
      schema:
        type: string
      example: '10234695'
  schemas:
    gendoc-attributes-schema:
      $ref: '#/components/schemas/item-response'
    item-response:
      type: object
      properties:
        item_id:
          $ref: '#/components/schemas/item_id'
        name:
          $ref: '#/components/schemas/name'
        status:
          $ref: '#/components/schemas/status'
        description:
          $ref: '#/components/schemas/description'
        rate:
          $ref: '#/components/schemas/rate'
        unit:
          $ref: '#/components/schemas/unit'
        tax_id:
          $ref: '#/components/schemas/tax_id'
        purchase_tax_rule_id:
          $ref: '#/components/schemas/purchase_tax_rule_id'
        sales_tax_rule_id:
          $ref: '#/components/schemas/sales_tax_rule_id'
        tax_name:
          $ref: '#/components/schemas/tax_name'
        hsn_or_sac:
          $ref: '#/components/schemas/hsn_or_sac'
        sat_item_key_code:
          $ref: '#/components/schemas/sat_item_key_code'
        unitkey_code:
          $ref: '#/components/schemas/unitkey_code'
        tax_percentage:
          $ref: '#/components/schemas/tax_percentage'
        tax_type:
          $ref: '#/components/schemas/tax_type'
        sku:
          $ref: '#/components/schemas/sku'
        product_type:
          $ref: '#/components/schemas/product_type'
        item_tax_preferences:
          $ref: '#/components/schemas/item_tax_preferences'
        custom_fields:
          $ref: '#/components/schemas/custom_fields'
        locations:
          $ref: '#/components/schemas/locations'
    name:
      description: Name of the item. Max-length [100]
      type: string
      example: Hard Drive
    rate:
      description: Price of the item.
      type: number
      format: double
      example: 120
    description:
      description: Description for the item. Max-length [2000]
      type: string
      example: 500GB
    status:
      description: Status of the item. It can be <code>active</code> or <code>inactive</code>
      type: string
      example: active
    unit:
      description: If there is a measurement unit for the items you are adding.
      type: string
      example: 100GB
    tax_id:
      description: 'ID of the tax to be associated to the item. Note: This value is a set of numeric characters.'
      type: string
      example: 982000000037049
      x-node_available_in: []
      x-node_unavailable_in:
        - us
        - in
    purchase_tax_rule_id:
      description: 'Id of the purchase tax rule. Note: This value is a set of numeric characters.'
      type: string
      example: 127919000000106780
      x-node_available_in:
        - mx
        - ke
        - za
      x-node_unavailable_in: []
    sales_tax_rule_id:
      description: 'Id of the sales tax rule. Note: This value is a set of numeric characters.'
      type: string
      example: 127919000000106780
      x-node_available_in:
        - mx
        - ke
        - za
      x-node_unavailable_in: []
    tax_precentage:
      type: string
      example: 10.5
      x-node_available_in: []
      x-node_unavailable_in:
        - us
    tax_name:
      type: string
      description: Name of the tax to be associated to the item.
      example: Sales Tax
    account_id:
      description: 'ID of the account to which the item has to be associated with. Note: This value is a set of numeric characters.'
      type: string
      example: ' '
    is_taxable:
      description: Boolean to track the taxability of the item.
      type: boolean
      example: true
      x-node_available_in:
        - in
        - us
        - mx
        - ke
        - za
      x-node_unavailable_in: []
    tax_exemption_id:
      description: 'ID of the tax exemption. Mandatory, if <code>is_taxable</code> is false. Note: This value is a set of numeric characters.'
      type: string
      example: '123456789'
      x-node_available_in:
        - in
        - us
        - mx
        - ke
        - za
      x-node_unavailable_in: []
    purchase_tax_exemption_id:
      description: 'ID of the purchase tax exemption. Mandatory, if <code>is_taxable</code> is false. Note: This value is a set of numeric characters.'
      type: string
      example: '123456789'
      x-node_available_in:
        - ke
        - za
      x-node_unavailable_in: []
    avatax_tax_code:
      description: A tax code is a unique label used to group Items (products, services, or charges) together. Max-length [25]
      type: string
      example: 982000000037049
      x-node_available_in:
        - Avalara Integration
      x-node_unavailable_in: []
    avatax_use_code:
      description: Used to group like customers for exemption purposes. It is a custom value that links customers to a tax rule. Select from Avalara [standard codes][1] or enter a custom code. Max-length [25]
      type: string
      example: 982000000037049
      x-node_available_in:
        - Avalara Integration
