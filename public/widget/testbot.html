<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFCOMFRT AI Support Bot Widget Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --whatsapp: #25D366;
            --whatsapp-hover: #1EBE5D;
            --bg-dark: #0F172A;
            --card-bg: #1E293B;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: #334155;
            --badge-bg: #312E81;
            --badge-text: #A5B4FC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .widget-container {
            width: 100%;
            max-width: 440px;
            height: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .widget-header {
            padding: 20px;
            background: linear-gradient(135deg, #4F46E5 0%, #312E81 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10B981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10B981;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .bot-msg {
            background: #334155;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-msg {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Escalation Card Styles */
        .escalation-card {
            background: linear-gradient(180deg, #1E1B4B 0%, #0F172A 100%);
            border: 1.5px solid #6366F1;
            border-radius: 16px;
            padding: 18px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ticket-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ticket-badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid #4F46E5;
        }

        .summary-pill {
            background: rgba(255, 255, 255, 0.06);
            border-left: 3px solid #6366F1;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #E2E8F0;
            line-height: 1.4;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .chat-footer {
            padding: 16px;
            background: #1E293B;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #0F172A;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input:focus {
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 20px 12px;
        }

        .action-chip {
            background: #334155;
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-chip:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="widget-header">
            <div class="header-title">
                <span class="status-dot"></span>
                OFFCOMFRT AI Support Bot
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="msg-bubble bot-msg">
                Hello! 👋 Welcome to OFFCOMFRT Support. How can I assist you today?
            </div>
        </div>

        <div class="quick-actions">
            <button class="action-chip" onclick="triggerScenario('track')">Order Tracking</button>
            <button class="action-chip" onclick="triggerScenario('cod')">COD Cash Problem</button>
            <button class="action-chip" onclick="triggerScenario('escalate')">Escalate to Agent</button>
        </div>

        <div class="chat-footer">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/widget/js/testbot.js"></script>
</body>
</html>
